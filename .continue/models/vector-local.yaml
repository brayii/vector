name: Vector Local Ollama
version: 1.0.0
schema: v1

models:
  - name: Vector Qwen2.5-Coder 7B
    provider: ollama
    model: qwen-coder-7b-local:latest
    apiBase: http://127.0.0.1:11434
    roles:
      - chat
      - edit
      - apply
      - autocomplete
    capabilities:
      - tool_use
    defaultCompletionOptions:
      contextLength: 24576
      maxTokens: 4096
      temperature: 0.2
    autocompleteOptions:
      debounceDelay: 350
      maxPromptTokens: 2048
      onlyMyCode: true
      useImports: true
      useRecentlyEdited: true
